name: Easy Mode tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: EasyMode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run the test suite
        run: python -m pytest -q

  gui-smoke:
    name: GUI smoke (Linux, headless)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EasyMode
    steps:
      - uses: actions/checkout@v4
      # Use the system python3 (not setup-python) so it matches the tkinter that
      # apt installs - python3-tk targets the distro interpreter.
      - name: Install tkinter + a virtual display
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3 python3-tk xvfb
      - name: Drive the GUI wizard end-to-end against a mock TV
        run: xvfb-run -a python3 tests/gui_smoke.py
